      background-attachment: fixed;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* Overlay para garantir a legibilidade do painel central sem perder o logo da imagem no canto */
    .overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(244, 246, 248, 0.4);
      backdrop-filter: blur(4px);
      z-index: 1;
    }
    
    .panel-container {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(1, 54, 46, 0.15);
      padding: 40px;
      position: relative;
      z-index: 10;
    }

    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-container h1 {
      color: var(--brand);
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .logo-container p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #DCE6E2;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-control:focus {
      border-color: var(--brand-light);
      box-shadow: 0 0 0 3px rgba(14, 107, 87, 0.1);
    }

    .btn {
      width: 100%;
      background: var(--brand);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn:hover {
      background: var(--brand-hover);
    }
    
    #errorMsg {
      color: #B5443A;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      margin-top: 10px;
      display: none;
    }

    /* SELEÇÃO DE MÓDULOS (ESCONDIDO INICIALMENTE) */
    #moduleSelection {
      display: none;
    }
    .module-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 24px;
    }
    .module-card {
      background: #EEF3F1;
      border: 1px solid #DCE6E2;
      border-radius: 8px;
      padding: 20px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: var(--text);
      display: block;
    }
    .module-card:hover {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(1, 54, 46, 0.1);
    }
    .module-card .icon {
      font-size: 28px;
      margin-bottom: 10px;
      display: block;
    }
    .module-card .title {
      font-weight: 700;
      font-size: 14px;
    }
    
    .logout-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      width: 100%;
      margin-top: 24px;
      text-decoration: underline;
    }
    .logout-btn:hover {
      color: var(--red);
    }
  </style>
</head>
<body>
  <div class="overlay"></div>

  <div class="panel-container">
    
    <!-- TELA DE LOGIN -->
    <div id="loginView">
      <div class="logo-container">
        <h1>Portal DeLuna</h1>
        <p>Acesso Restrito · Controle Operacional</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" class="form-control" placeholder="Digite seu usuário" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>
        
        <button type="submit" class="btn">Entrar no Portal</button>
        <div id="errorMsg">Usuário ou senha incorretos.</div>
      </form>
    </div>

    <!-- TELA DE SELEÇÃO DE MÓDULOS -->
    <div id="moduleSelection">
      <div class="logo-container">
        <h1>Bem-vindo, <span id="userNameDisplay"></span>!</h1>
        <p>Selecione o módulo que deseja acessar:</p>
      </div>

      <div class="module-grid">
        <a href="index.html" class="module-card">
          <span class="icon">🚛</span>
          <span class="title">Controle de Frota</span>
        </a>
        <a href="painel_frota.html" class="module-card">
          <span class="icon">💰</span>
          <span class="title">Gestão de Custos</span>
        </a>
        <a href="#" class="module-card" onclick="alert('Módulo de Cadastro em desenvolvimento.')">
          <span class="icon">📝</span>
          <span class="title">Tela de Cadastro</span>
        </a>
        <a href="#" class="module-card" onclick="alert('Módulo de Captação em desenvolvimento.')">
          <span class="icon">🎯</span>
          <span class="title">Captação</span>
        </a>
      </div>

      <button class="logout-btn" onclick="logout()">Encerrar Sessão</button>
    </div>

  </div>

  <script>
    const VALID_CREDENTIALS = {
      'adm': 'frota2026',
      'guilherme': 'frota2026',
      'mariana': 'frota2026',
      'alexsander': 'frota2026'
    };

    function checkAuth() {
      const loggedUser = sessionStorage.getItem('admin_logged_user');
      if (loggedUser && VALID_CREDENTIALS[loggedUser.toLowerCase()]) {
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('moduleSelection').style.display = 'block';
        document.getElementById('userNameDisplay').textContent = loggedUser.charAt(0).toUpperCase() + loggedUser.slice(1);
      } else {
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('moduleSelection').style.display = 'none';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim().toLowerCase();
      const p = document.getElementById('password').value.trim();
      
      if (VALID_CREDENTIALS[u] && VALID_CREDENTIALS[u] === p) {
        sessionStorage.setItem('admin_logged_user', u);
        sessionStorage.setItem('auth_gestao_custos', 'true'); // Tag usada no painel de custos
        document.getElementById('errorMsg').style.display = 'none';
        checkAuth();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    });

    function logout() {
      sessionStorage.removeItem('admin_logged_user');
      sessionStorage.removeItem('auth_gestao_custos');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      checkAuth();
    }

    // Inicia checando se a pessoa já estava logada no navegador
    checkAuth();
  </script>
</body>
</html>
