<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal DeLuna · Controle de Operações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #01362E;
      --brand-light: #0E6B57;
      --brand-hover: #128064;
      --bg: #F4F6F8;
      --text: #142822;
      --text-muted: #55645D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Barlow', sans-serif; }
    body {
      background: var(--bg);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .panel-container {
      background: #ffffff;
      width: 100%;
      max-width: 460px;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(1, 54, 46, 0.15);
      padding: 40px;
    }
    .logo-container { text-align: center; margin-bottom: 24px; }
    .logo-container h1 { color: var(--brand); font-size: 24px; font-weight: 700; margin-bottom: 4px; }
    .logo-container p { color: var(--text-muted); font-size: 14px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; font-size: 13.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px 14px; border: 1px solid #DCE6E2; border-radius: 6px; font-size: 14px; outline: none; }
    .btn { width: 100%; background: var(--brand); color: #fff; border: none; padding: 14px; border-radius: 6px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn:hover { background: var(--brand-hover); }
    #errorMsg { color: #B5443A; font-size: 13px; font-weight: 600; text-align: center; margin-top: 10px; display: none; }
    #moduleSelection { display: none; }
    .module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
    .module-card { background: #EEF3F1; border: 1px solid #DCE6E2; border-radius: 8px; padding: 20px 16px; text-align: center; cursor: pointer; text-decoration: none; color: var(--text); display: block; }
    .module-card:hover { background: var(--brand); border-color: var(--brand); color: #fff; }
    .module-card .icon { font-size: 28px; margin-bottom: 10px; display: block; }
    .module-card .title { font-weight: 700; font-size: 14px; }
    .logout-btn { background: transparent; border: none; color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; width: 100%; margin-top: 24px; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="panel-container">
    <div id="loginView">
      <div class="logo-container">
        <h1>Portal DeLuna</h1>
        <p>Acesso Restrito · Controle Operacional</p>
      </div>
      <form id="loginForm">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" class="form-control" placeholder="Digite seu usuário" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" class="form-control" placeholder="Digite sua senha" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn">Entrar no Portal</button>
        <div id="errorMsg">Usuário ou senha incorretos.</div>
        <div style="margin-top: 14px; text-align: center;">
          <button type="button" id="showRegisterBtn" style="background:none; border:none; color: #0E6B57; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: underline;">
            Cadastrar novo usuário
          </button>
        </div>
      </form>

      <form id="registerForm" style="display:none; margin-top: 10px;">
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="regUsername">Novo Usuário</label>
          <input type="text" id="regUsername" class="form-control" placeholder="Escolha um login" required autocomplete="off">
        </div>
        <div class="form-group" style="margin-bottom: 12px;">
          <label for="regPassword">Senha</label>
          <input type="text" id="regPassword" class="form-control" placeholder="Escolha uma senha" required autocomplete="off">
        </div>
        <button type="submit" class="btn" style="background: #128064;">Cadastrar e Entrar</button>
        <button type="button" id="backToLoginBtn" class="logout-btn" style="margin-top: 12px;">Voltar ao Login</button>
        <div id="regErrorMsg" style="color: #B5443A; font-size: 12px; font-weight: 600; text-align: center; margin-top: 8px; display: none;"></div>
      </form>
    </div>

    <div id="moduleSelection">
      <div class="logo-container">
        <h1>Bem-vindo, <span id="userNameDisplay"></span>!</h1>
        <p>Selecione o módulo que deseja acessar:</p>
      </div>
      <div class="module-grid">
        <a href="portal_frota.html" class="module-card">
          <span class="icon">🚛</span>
          <span class="title">Controle de Frota</span>
        </a>
        <a href="painel_frota.html" class="module-card">
          <span class="icon">💰</span>
          <span class="title">Gestão de Custos</span>
        </a>
        <a href="#" class="module-card" onclick="alert('Módulo de Cadastro em desenvolvimento.')">
          <span class="icon">📝</span>
          <span class="title">Tela de Cadastro</span>
        </a>
        <a href="#" class="module-card" onclick="alert('Módulo de Captação em desenvolvimento.')">
          <span class="icon">🎯</span>
          <span class="title">Captação</span>
        </a>
      </div>
      <button class="logout-btn" onclick="logout()">Encerrar Sessão</button>
    </div>
  </div>

  <script>
    const DEFAULT_USERS = {
      'adm': 'frota2026',
      'guilherme': 'frota2026',
      'mariana': 'frota2026',
      'alexsander': 'frota2026'
    };

    function getValidCredentials() {
      const custom = JSON.parse(localStorage.getItem('frota_deluna_custom_users') || '{}');
      return { ...DEFAULT_USERS, ...custom };
    }

    function checkAuth() {
      const loggedUser = sessionStorage.getItem('admin_logged_user');
      const creds = getValidCredentials();
      if (loggedUser && creds[loggedUser.toLowerCase()]) {
        document.getElementById('loginView').style.display = 'none';
        document.getElementById('moduleSelection').style.display = 'block';
        document.getElementById('userNameDisplay').textContent = loggedUser.charAt(0).toUpperCase() + loggedUser.slice(1);
      } else {
        document.getElementById('loginView').style.display = 'block';
        document.getElementById('moduleSelection').style.display = 'none';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim().toLowerCase();
      const p = document.getElementById('password').value.trim();
      const creds = getValidCredentials();
      
      if (creds[u] && creds[u] === p) {
        sessionStorage.setItem('admin_logged_user', u);
        sessionStorage.setItem('auth_gestao_custos', 'true');
        document.getElementById('errorMsg').style.display = 'none';
        checkAuth();
      } else {
        document.getElementById('errorMsg').style.display = 'block';
      }
    });

    document.getElementById('showRegisterBtn').addEventListener('click', function() {
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    });

    document.getElementById('backToLoginBtn').addEventListener('click', function() {
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('loginForm').style.display = 'block';
    });

    document.getElementById('registerForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const u = document.getElementById('regUsername').value.trim().toLowerCase();
      const p = document.getElementById('regPassword').value.trim();
      const err = document.getElementById('regErrorMsg');

      if (!u || !p) return;

      const custom = JSON.parse(localStorage.getItem('frota_deluna_custom_users') || '{}');
      if (DEFAULT_USERS[u] || custom[u]) {
        err.textContent = 'Este usuário já existe.';
        err.style.display = 'block';
        return;
      }

      custom[u] = p;
      localStorage.setItem('frota_deluna_custom_users', JSON.stringify(custom));

      sessionStorage.setItem('admin_logged_user', u);
      sessionStorage.setItem('auth_gestao_custos', 'true');
      checkAuth();
    });

    function logout() {
      sessionStorage.removeItem('admin_logged_user');
      sessionStorage.removeItem('auth_gestao_custos');
      document.getElementById('username').value = '';
      document.getElementById('password').value = '';
      checkAuth();
    }

    checkAuth();
  </script>
</body>
</html>
